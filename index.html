<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semi Donut Pixelado — Protótipo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div id="playerHud" class="player-hud">
      <div class="player-hud__top">
        <span class="player-hud__label">NÍVEL</span>
        <span id="playerLevel" class="player-hud__level">1</span>
      </div>
      <div class="player-hud__bar">
        <div id="playerXpFill" class="player-hud__fill"></div>
      </div>
      <div id="playerXpMeta" class="player-hud__meta">0 / 19 XP</div>
      <div id="cardInventory" class="card-inventory" aria-label="Cartas obtidas"></div>
    </div>
    <div id="sessionHud" class="session-hud" aria-live="polite">
      <span class="session-hud__label">FRAGMENTOS</span>
      <span id="sessionFragments" class="session-hud__value">0</span>
    </div>
    <div id="multiHud" class="multi-hud" aria-live="polite">
      <div class="multi-hud__top">
        <span class="multi-hud__label">MULTI</span>
        <span id="multiTier" class="multi-hud__tier">×1</span>
      </div>
      <div class="multi-hud__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="multiFill" class="multi-hud__fill"></div>
      </div>
      <div id="multiMeta" class="multi-hud__meta">0 / 10 → ×2</div>
    </div>
    <div id="gameOverOverlay" class="game-over" hidden>
      <div class="game-over__panel">
        <p class="game-over__title">GAME OVER</p>
        <p id="gameOverReason" class="game-over__text"></p>
        <div id="gameOverRecap" class="game-over__recap"></div>
        <div id="gameOverFragments" class="game-over__fragments"></div>
        <div id="gameOverShop" class="game-over__shop" aria-label="Loja da sessão"></div>
        <button id="gameOverRestart" type="button" class="game-over__btn">Jogar de novo</button>
      </div>
    </div>
    <div id="sessionBlessingOverlay" class="level-draft session-blessing" hidden>
      <div class="level-draft__panel">
        <p class="level-draft__title">Bênção de início</p>
        <p class="level-draft__subtitle">Escolha 1 bônus para esta run (válido só nesta partida).</p>
        <div id="sessionBlessingChoices" class="level-draft__choices"></div>
      </div>
    </div>
    <div id="levelDraftOverlay" class="level-draft" hidden>
      <div class="level-draft__panel">
        <p id="levelDraftTitle" class="level-draft__title" hidden></p>
        <p id="levelDraftSubtitle" class="level-draft__subtitle" hidden></p>
        <div id="levelDraftChoices" class="level-draft__choices"></div>
        <button id="levelDraftReroll" type="button" class="level-draft__reroll" hidden>Sortear</button>
      </div>
    </div>
    <canvas id="gameCanvas" aria-label="Semi donut pixelado dividido em cinco setores"></canvas>
    <div id="cannonDebug" class="cannon-debug">
      <div class="cannon-debug__label">Canhão (debug)</div>
      <div id="cannonDebugAngle" class="cannon-debug__angle">0.0°</div>
      <div id="cannonDebugMeta" class="cannon-debug__meta">φ 0.00 rad · varredura →</div>
    </div>
  </main>

  <script src="cards.js"></script>
  <script src="session-meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
